spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: api
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  docker:
    compose:
      skip:
        in-tests: false

finora:
  jwt:
    segredo: ${JWT_SECRET}
    expiracao: 15m
  cors:
    origens-permitidas: ${CORS_ORIGENS:http://localhost:4200}
