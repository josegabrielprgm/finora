@if (visivel()) {
  <section class="saudacao" aria-labelledby="saudacao-titulo">
    <!-- Decoração pura: escondida do leitor de tela -->
    <div class="fundo" aria-hidden="true">
      @for (c of coracoes; track c.id) {
        <span
          class="flutuante"
          [style.left.%]="c.x"
          [style.font-size.rem]="c.tamanho"
          [style.animation-delay.s]="c.atraso"
          [style.animation-duration.s]="c.duracao"
          [style.--desvio]="c.desvio + 'px'"
          >{{ c.emoji }}</span
        >
      }
      <span class="brilho b1">✦</span>
      <span class="brilho b2">✧</span>
      <span class="brilho b3">✦</span>
      <span class="brilho b4">✧</span>
    </div>

    <div class="chuva" aria-hidden="true">
      @for (p of chuva(); track p.id) {
        <span
          class="gota"
          [style.left.%]="p.x"
          [style.font-size.rem]="p.tamanho + 0.4"
          [style.animation-delay.s]="p.atraso"
          [style.animation-duration.s]="p.duracao"
          [style.--desvio]="p.desvio * 2 + 'px'"
          >{{ p.emoji }}</span
        >
      }
    </div>

    <div class="conteudo">
      <span class="mascote" aria-hidden="true">🐰</span>
      <div>
        <h2 id="saudacao-titulo">
          Oiê, <span class="nome">Samara</span>!
          <span class="aceno" aria-hidden="true">👋</span>
        </h2>
        <p>Que bom ter você por aqui! Você deixa tudo mais leve e bonito, até planilha de gastos. 💕</p>
      </div>
    </div>

    <div class="acoes">
      <button matButton="outlined" type="button" (click)="celebrar()">
        <mat-icon matButtonIcon>favorite</mat-icon>
        Clica aqui
      </button>
      <button matIconButton type="button" aria-label="Fechar saudação" (click)="fechar()">
        <mat-icon>close</mat-icon>
      </button>
    </div>
  </section>
}
